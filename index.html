<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wedding QR Check-in</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #fff0f5, #f8f8ff);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: white;
        width: 95%;
        max-width: 450px;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      h1 {
        color: #b76e79;
        margin-bottom: 25px;
      }

      #reader {
        width: 100%;
        margin: auto;
        border-radius: 15px;
        overflow: hidden;
      }

      #result {
        margin-top: 25px;
        padding: 15px;
        border-radius: 15px;
        font-size: 20px;
        font-weight: bold;
        min-height: 60px;
      }

      .success {
        background: #e8f8ed;
        color: #16803c;
        border: 2px solid #16803c;
      }

      .error {
        background: #ffeaea;
        color: #c62828;
        border: 2px solid #c62828;
      }

      .info {
        background: #f2f2f2;
        color: #555;
      }

      button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 30px;
        background: #b76e79;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #9e5963;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>💍 Wedding QR Check-in</h1>

      <div id="reader"></div>

      <div id="result" class="info">Waiting for QR...</div>

      <button onclick="clearHistory()">Reset Check-in</button>
    </div>

    <script>
      let scannedGuests =
        JSON.parse(localStorage.getItem("scannedGuests")) || [];

      let scanner;

      function startScanner() {
        scanner = new Html5QrcodeScanner(
          "reader",

          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250,
            },
          },

          false,
        );

        scanner.render(onScanSuccess, onScanFailure);
      }

      function onScanSuccess(decodedText) {
        scanner.clear();

        let guest;

        // Validate JSON

        try {
          guest = JSON.parse(decodedText);
        } catch (error) {
          showError("❌ Invalid QR Code");

          restartScanner();

          return;
        }

        // Validate data

        if (!guest.name || guest.companions === undefined || !guest.status) {
          showError("❌ Invalid Guest Information");

          restartScanner();

          return;
        }

        // Check duplicate scan

        let exists = scannedGuests.some((g) => g.name === guest.name);

        if (exists) {
          showError(`

❌ Already Checked-in

<br><br>

Guest:
${guest.name}

`);

          restartScanner();

          return;
        }

        // Save check-in

        scannedGuests.push(guest);

        localStorage.setItem(
          "scannedGuests",

          JSON.stringify(scannedGuests),
        );

        // Show success

        document.getElementById("result").innerHTML = `


<div class="success">


✅ Welcome ${guest.name}

<br><br>


👥 Guests:
${guest.companions}


<br><br>


📌 Status:
${guest.status}


</div>


`;

        console.log(guest);

        restartScanner();
      }

      function showError(message) {
        document.getElementById("result").innerHTML = `

<div class="error">

${message}

</div>

`;
      }

      function onScanFailure(error) {}

      function restartScanner() {
        setTimeout(() => {
          document.getElementById("result").innerHTML = `
<div class="info">
Waiting for QR...
</div>
`;

          startScanner();
        }, 3000);
      }

      function clearHistory() {
        localStorage.removeItem("scannedGuests");

        alert("Check-in history cleared");
      }

      startScanner();
    </script>
  </body>
</html>
