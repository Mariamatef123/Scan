<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wedding Check-in</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
      body {
        font-family: Arial;
        background: #f4f4f4;
        text-align: center;
        padding: 30px;
      }

      #reader {
        width: 350px;
        margin: auto;
      }

      #result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
      }

      .success {
        color: green;
      }

      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Wedding QR Check-in</h1>

    <div id="reader"></div>

    <div id="result">Waiting for QR...</div>

    <script>
      function onScanSuccess(decodedText) {
        html5QrcodeScanner.clear();

        const guest = JSON.parse(decodedText);

        document.getElementById("result").innerHTML = `
        <div class="success">
        ✅ Welcome ${guest.name}<br><br>

        Guests : ${guest.companions}<br><br>

        Status : ${guest.status}
        </div>
    `;

        console.log(guest);
      }

      function onScanFailure(error) {}

      const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: 250,
        },
        false,
      );

      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
  </body>
</html>
